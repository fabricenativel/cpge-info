<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Mini IDE Python</title>
    
    <!-- 1. Importation de CodeMirror (Design de l'éditeur) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <!-- 2. Importation de Pyodide (Moteur Python) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
        #output { background-color: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; min-height: 50px;}
        
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; border-radius: 4px; transition: 0.3s;}
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        
        .CodeMirror { height: auto; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;}
    </style>
</head>
<body>

    <h2>Éditeur Python en ligne</h2>
    
    <!-- Zone où l'utilisateur tape son code -->
    <textarea id="code"># Initialisation de l'éditeur...</textarea>

    <!-- Bouton pour lancer le code -->
    <button id="run-btn" disabled>Chargement de Python...</button>

    <!-- Zone d'affichage des résultats -->
    <h3>Résultat :</h3>
    <div id="output"></div>

    <script>
        // --- ÉTAPE 1 : Initialisation de l'interface CodeMirror ---
        var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
            mode: "python",
            theme: "monokai",
            lineNumbers: true,
            viewportMargin: Infinity
        });

        // --- ÉTAPE 2 : Chargement du fichier depuis l'URL ---
        async function chargerScriptDepuisURL() {
            // On analyse l'URL (ex: ide.html?fichier=script.py)
            const parametres = new URLSearchParams(window.location.search);
            const cheminFichier = parametres.get("fichier");

            if (cheminFichier) {
                editor.setValue("# Chargement du script en cours...\n");
                try {
                    const reponse = await fetch(cheminFichier);
                    if (!reponse.ok) {
                        throw new Error(`Erreur HTTP ${reponse.status}`);
                    }
                    const codeTexte = await reponse.text();
                    editor.setValue(codeTexte); // On injecte le code du fichier
                } catch (erreur) {
                    editor.setValue(`# Erreur : Impossible de charger le fichier '${cheminFichier}'\n# Détail : ${erreur.message}`);
                }
            } else {
                // S'il n'y a pas de paramètre dans l'URL, on met un code par défaut
                editor.setValue("# Tapez votre code Python ici !\ndef dire_bonjour(nom):\n    return f\"Bonjour {nom} !\"\n\nprint(dire_bonjour('visiteur'))");
            }
        }

        chargerScriptDepuisURL(); // On lance la fonction immédiatement

        // --- ÉTAPE 3 : Initialisation de Pyodide ---
        let pyodideInstance;
        async function initPyodide() {
            pyodideInstance = await loadPyodide();
            
            // On redirige print() vers la div #output
            pyodideInstance.setStdout({ batched: (msg) => {
                document.getElementById("output").innerText += msg + "\n";
            }});

            // On active le bouton
            const btn = document.getElementById("run-btn");
            btn.innerText = "▶ Exécuter le code";
            btn.disabled = false;
        }

        initPyodide(); // On lance le chargement de Python

        // --- ÉTAPE 4 : Exécution du code au clic ---
        document.getElementById("run-btn").addEventListener("click", async () => {
            const outputDiv = document.getElementById("output");
            outputDiv.innerText = ""; // On nettoie l'ancien résultat
            outputDiv.style.color = "black"; // On remet la couleur par défaut
            
            const code = editor.getValue(); // Récupère le code de l'éditeur
            
            try {
                // On exécute le code Python
                await pyodideInstance.runPythonAsync(code);
            } catch (err) {
                // En cas d'erreur de syntaxe Python, on l'affiche en rouge
                outputDiv.style.color = "red";
                outputDiv.innerText = err.message;
            }
        });
    </script>
</body>
</html>
